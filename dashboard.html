<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payclass</title>
    <!-- css -->
    <link rel="stylesheet" href="dashboard.css">
    <!-- boxicon css -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <nav class="sidebar">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="logo.png" alt="Logo PayClass">
                </span>
                <div class="text header-text">
                    <span class="name">Payclass</span>
                    <span class="profession">Kas Kelas IF-1B</span>
                </div>
            </div>

            <i class="bx bx-chevron-right toggle"></i>
        </header>

        <div class="menu-bar">
            <div class="menu">

                <p class="menu-label">MENU</p>
                <ul class="menu-links">
                    <li class="nav-link active">
                        <a href="#">
                            <i class="bx bx-home-alt icon"></i>
                            <span class="text nav-text">Dashboard</span>
                        </a>
                    </li>
                </ul>

                <p class="menu-label">DATA UTAMA</p>
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-group icon"></i>
                            <span class="text nav-text">Data Anggota</span>
                        </a>
                    </li>
                    
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-transfer icon"></i>
                            <span class="text nav-text">Data Transaksi</span>
                        </a>
                    </li>
                </ul>

                <ul class="menu-links menu-links-last">
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-bar-chart-alt-2 icon"></i>
                            <span class="text nav-text">Laporan</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="bottom-content">
                <ul>
                    <li class="logout">
                        <a href="#">
                            <i class="bx bx-log-out icon"></i>
                            <span class="text nav-text">Keluar</span>
                        </a>
                    </li>
                </ul>
                <div class="user-profile">
                    <div class="avatar">C</div>
                    <div class="text user-info">
                        <span class="user-name">Charisa</span>
                        <span class="user-role">Bendahara</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- bilah atas -->
    <header class="topbar">
        <div class="search-pill">
            <i class="bx bx-search"></i>
            <input type="search" placeholder="Cari anggota atau transaksi...">
        </div>
        <div class="user-pill">
            <span>Charisa</span>
            <i class="bx bx-chevron-down"></i>
        </div>
    </header>

    <!-- isi halaman -->
    <main class="home">
        <h1>Beranda</h1>
    </main>

    <script src="dashboard.js"></script>

</body>
</html>
